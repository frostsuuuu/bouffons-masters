<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bouffons Masters</title>
  <meta name="theme-color" content="#0b0a17">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <!--
    MISE À JOUR AUTOMATIQUE
    Les fichiers du jeu sont chargés avec un "?v=..." unique à chaque visite,
    pour que tout le monde ait toujours la dernière version publiée sur GitHub.
    js/maj.js vérifie aussi régulièrement si une nouvelle version est en ligne
    et recharge la page tout seul (sans couper une ouverture de booster).
    ⚠️ Si vous ajoutez un fichier .js ou .css, ajoutez-le dans BM_FILES ci-dessous
    (dans le bon ordre), pas avec une balise <script> ou <link> classique.
  -->
  <script>
    window.BM_FILES = {
      css: ["css/style.css"],
      js: [ // L'ordre compte : réglages → cartes → sauvegarde → logique → interface
        "js/config.js", "js/supabase-config.js", "js/cards.js", "js/storage.js",
        "js/game.js", "js/online.js", "js/app.js", "js/social.js", "js/maj.js"
      ]
    };
    window.BM_VERSION_LOAD = Date.now();
    BM_FILES.css.forEach(function (f) {
      document.write('<link rel="stylesheet" href="' + f + '?v=' + BM_VERSION_LOAD + '">');
    });
  </script>
</head>
<body>
  <div id="errors" class="errors" hidden></div>

  <header class="topbar">
    <a class="brand" href="#booster" aria-label="Booster">
      <span class="brand-logo" data-logo></span>
      <span class="brand-name">Bouffons <b>Masters</b></span>
    </a>
    <nav class="nav" aria-label="Navigation">
      <a href="#booster" data-page="booster"><span class="ico">🎁</span><span>Booster</span></a>
      <a href="#collection" data-page="collection"><span class="ico">🃏</span><span>Collection</span></a>
      <a href="#fusion" data-page="fusion"><span class="ico">⚗️</span><span>Fusion</span><i class="nav-badge" id="fusionBadge" hidden></i></a>
      <a href="#social" data-page="social"><span class="ico">👥</span><span>Social</span><i class="nav-badge" id="socialBadge" hidden></i></a>
      <a href="#profil" data-page="profil"><span class="ico">👤</span><span>Profil</span></a>
    </nav>
    <div class="pill" id="boosterPill" title="Boosters disponibles">🎁 <b id="boosterCount">0</b><span class="pill-timer" id="pillTimer" hidden></span></div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <span>Bouffons Masters · V1.3</span>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" data-close aria-label="Fermer">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="fx" class="fx"></div>
  <div id="toasts" class="toasts"></div>

  <!-- Scripts du jeu : la liste est dans BM_FILES (en haut de la page) -->
  <script>
    BM_FILES.js.forEach(function (f) {
      document.write('<script src="' + f + '?v=' + BM_VERSION_LOAD + '"><\/script>');
    });
  </script>
</body>
</html>
